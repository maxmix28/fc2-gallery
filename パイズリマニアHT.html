<script>
function toggleFav(id) {
  const key = 'fav-' + id;
  const current = localStorage.getItem(key) === 'true';
  localStorage.setItem(key, !current);
  updateStars();
}
function updateStars() {
  document.querySelectorAll('.entry').forEach(entry => {
    const id = entry.dataset.id;
    const star = entry.querySelector('.fav-star');
    const isFav = localStorage.getItem('fav-' + id) === 'true';
    star.innerHTML = isFav ? '★' : '☆';
    star.classList.toggle('faved', isFav);
  });
}
function toggleFavoritesOnly() {
  const onlyFav = document.body.classList.toggle('show-favs');
  document.querySelectorAll('.entry').forEach(entry => {
    const isFav = localStorage.getItem('fav-' + entry.dataset.id) === 'true';
    entry.style.display = onlyFav && !isFav ? 'none' : '';
  });
}
Fancybox.bind("[data-fancybox]", {});
updateStars();
</script>
